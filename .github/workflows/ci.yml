name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e "backend[dev,pipeline]"
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest -q backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e "backend[dev]"
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - name: Start stack
        env:
          FAKE_MODELS: "true"
        run: |
          clipforge-check
          nohup clipforge-api > api.log 2>&1 &
          nohup clipforge-worker > worker.log 2>&1 &
          (cd web && nohup npm start > ../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3000 >/dev/null && curl -sf 127.0.0.1:8000/api/health >/dev/null && break; sleep 1; done
      - run: npx playwright test
        working-directory: web
        env:
          PYTHON: python
      - if: failure()
        run: tail -n 100 api.log worker.log web.log
